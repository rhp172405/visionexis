services:
  - type: web
    name: visionexis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: visionexis-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://visionexis.vercel.app"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: ENVIRONMENT
        value: production

databases:
  - name: visionexis-postgres
    databaseName: eyecog
    user: visionexis
    plan: free
